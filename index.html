        class ErrorBoundary extends React.Component {
          constructor(props) {
            super(props);
            this.state = { hasError: false, error: null };
          }
          static getDerivedStateFromError(error) { return { hasError: true, error }; }
          componentDidCatch(error, errorInfo) { console.error("App Crashed:", error, errorInfo); }
          render() {
            if (this.state.hasError) {
              return (
                <div className="p-8 bg-red-50 text-red-900 min-h-screen flex flex-col items-center justify-center text-center">
                  <AlertCircle className="w-16 h-16 mb-4 text-red-500" />
                  <h1 className="text-2xl font-black mb-2">App Failed to Load</h1>
                  <p className="font-medium text-red-700 mb-4">A background error occurred. Please screenshot this and send it to your admin:</p>
                  <pre className="text-left bg-white p-4 rounded-xl shadow-inner text-[10px] text-red-800 border border-red-200 w-full overflow-auto whitespace-pre-wrap">
                    {this.state.error?.toString()}
                  </pre>
                  <button onClick={() => window.location.reload()} className="mt-6 bg-red-600 text-white font-bold px-6 py-3 rounded-xl shadow-lg">Refresh App</button>
                </div>
              );
            }
            return this.props.children;
          }
        }

        const App = () => {
          const [user, setUser] = useState(null);
          const [view, setView] = useState('home'); 
          const [historyTab, setHistoryTab] = useState('logs');
          const [logs, setLogs] = useState([]);
          const [loading, setLoading] = useState(true);
          const [submitting, setSubmitting] = useState(false);
          const [error, setError] = useState(null);
          
          const [deleteConfirmId, setDeleteConfirmId] = useState(null);
          const [pinInput, setPinInput] = useState('');
          const [resolveId, setResolveId] = useState(null);
          const [resolveNote, setResolveNote] = useState('');
          const [resolveInitials, setResolveInitials] = useState('');

          // Form State
          const [selectedLocKey, setSelectedLocKey] = useState(null);
          const [initials, setInitials] = useState('');
          const [checklist, setChecklist] = useState({});
          const [comment, setComment] = useState('');
          const [selectedUnit, setSelectedUnit] = useState('Lady Sobell');
          const [closureDate, setClosureDate] = useState(new Date().toISOString().split('T')[0]);
          const [closureReason, setClosureReason] = useState('');
          const [isRoomClosed, setIsRoomClosed] = useState(false);
          const [auditDate, setAuditDate] = useState(new Date().toISOString().split('T')[0]);
          const [reportEndDate, setReportEndDate] = useState(new Date().toISOString().split('T')[0]);

          useEffect(() => {
            const initAuth = async () => {
              try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                  await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                  await signInAnonymously(auth);
                }
              } catch (err) {
                console.error("Auth error:", err);
                setError("Failed to authenticate.");
              }
            };
            initAuth();
            const unsubscribe = onAuthStateChanged(auth, (u) => { setUser(u); setLoading(false); });
            return () => unsubscribe();
          }, []);

          useEffect(() => {
            if (!user) return;
            const logsRef = collection(db, 'artifacts', appId, 'public', 'data', 'checklist_logs');
            const q = query(logsRef);
            const unsubscribe = onSnapshot(q, (snapshot) => {
              try {
                const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                const sortedData = data.sort((a, b) => {
                  const timeA = a.timestamp?.seconds || (new Date(a.timestamp).getTime() / 1000) || 0;
                  const timeB = b.timestamp?.seconds || (new Date(b.timestamp).getTime() / 1000) || 0;
                  return timeB - timeA;
                });
                setLogs(sortedData);
              } catch(err) { console.error("Error processing logs", err); }
            });
            return () => unsubscribe();
          }, [user]);

          const currentLogs = logs.filter(log => log.unit === selectedUnit || (!log.unit && selectedUnit === 'Lady Sobell'));

          // Crucial fix: Safe date formatter to prevent mobile crashes
          const formatDate = (timestamp) => {
            if (!timestamp) return "";
            try {
              const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
              const dStr = date.toLocaleDateString();
              const tStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
              return `${dStr} ${tStr}`;
            } catch (e) {
              return "Invalid Date";
            }
          };

          const getLogDate = (log) => {
            if (!log || !log.timestamp) return new Date();
            return log.timestamp?.toDate ? log.timestamp.toDate() : new Date(log.timestamp);
          };

          const isSameDay = (d1, d2) => {
            if(!d1 || !d2) return false;
            return d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();
          };

          const todayLogs = currentLogs.filter(log => isSameDay(getLogDate(log), new Date()));
          const isUnitClosedToday = todayLogs.some(log => log.type === 'unit_closure');

          // Determine Pending Action Items
          const actionItems = currentLogs.filter(log => {
             if (log.type === 'unit_closure' || log.type === 'room_closure' || log.isResolved) return false;
             if (log.type === 'trolley_audit') {
                 return Object.values(log.checklist || {}).some(item => !item.checked);
             } else {
                 const dailyKeys = Object.keys(log.checklist || {}).filter(k => k.startsWith('daily_'));
                 return dailyKeys.length > 0 && !dailyKeys.every(k => log.checklist[k]);
             }
          });

          const last7Days = Array.from({length: 7}, (_, i) => {
            const [year, month, day] = reportEndDate.split('-');
            const d = new Date(parseInt(year), parseInt(month) - 1, parseInt(day));
            d.setDate(d.getDate() - i);
            return d;
          });

          const weeklyChartData = last7Days.map(d => {
            const dayLogs = currentLogs.filter(log => isSameDay(getLogDate(log), d));
            const isUnitClosed = dayLogs.some(log => log.type === 'unit_closure');
            let completed = 0;
            const totalAreas = Object.keys(CHECKLIST_DATA).length;

            if (!isUnitClosed) {
                Object.keys(CHECKLIST_DATA).forEach(locKey => {
                    const areaLog = dayLogs.find(log => log.locationKey === locKey && log.type !== 'trolley_audit');
                    if (areaLog) {
                        if (areaLog.type === 'room_closure') completed++;
                        else {
                            const dailyKeys = Object.keys(areaLog.checklist || {}).filter(k => k.startsWith('daily_'));
                            if (dailyKeys.length === 0 || dailyKeys.every(k => areaLog.checklist[k])) completed++;
                        }
                    }
                });
            }
            return { date: d, isUnitClosed, percentage: isUnitClosed ? 0 : Math.round((completed / totalAreas) * 100), completed, totalAreas };
          }).reverse(); 

          const getDailyTasks = (locKey, unit) => {
            let tasks = [...(CHECKLIST_DATA[locKey]?.daily || [])];
            
            // Remove emergency trolley from Room 1 and 2 globally
            if (locKey === 'room1' || locKey === 'room2') {
              tasks = tasks.filter(task => !task.toLowerCase().includes('emergency trolley'));
            }
            
            // Lady Sobell logic vs Endoscopy Suite
            if (unit === 'Lady Sobell') {
              if (locKey === 'room1' || locKey === 'room2') {
                tasks = tasks.filter(task => !task.toLowerCase().includes('fridge'));
              }
              if (locKey === 'recovery') {
                if (!tasks.includes('Clean and Check fridge temperature')) {
                  tasks.push('Clean and Check fridge temperature');
                }
              }
            } else { // Endoscopy Suite logic
              if (locKey === 'room1') {
                tasks = tasks.filter(task => task !== 'Dust X-Ray machine');
              }
              if (locKey === 'recovery') {
                tasks = tasks.filter(task => task !== 'ECG machine – clean and charge');
              }
            }
            return tasks;
          };

          const getWeeklyTasks = (locKey, unit) => {
            let tasks = [...(CHECKLIST_DATA[locKey]?.weekly || [])];
            
            // Remove emergency trolley from Room 1 and 2 globally
            if (locKey === 'room1' || locKey === 'room2') {
              tasks = tasks.filter(task => !task.toLowerCase().includes('emergency trolley'));
            }
            
            // Lady Sobell logic
            if (unit === 'Lady Sobell') {
              if (locKey === 'room1' || locKey === 'room2') {
                tasks = tasks.filter(task => !task.toLowerCase().includes('fridge'));
              }
            }
            return tasks;
          };

          const checkExpiryWarning = (expiryStr, auditDateStr) => {
            if (!expiryStr) return false; 
            const [expYear, expMonth] = expiryStr.split('-');
            const expDate = new Date(parseInt(expYear), parseInt(expMonth) - 1, 1); 
            const [audYear, audMonth, audDay] = auditDateStr.split('-');
            const audDate = new Date(parseInt(audYear), parseInt(audMonth) - 1, parseInt(audDay));
            const thresholdDate = new Date(audDate);
            thresholdDate.setMonth(thresholdDate.getMonth() + 1);
            return expDate <= thresholdDate;
          };

          const startChecklist = (key) => {
            setSelectedLocKey(key); setComment(''); setIsRoomClosed(false); setAuditDate(new Date().toISOString().split('T')[0]); 
            if (key === 'bleed_trolley') {
              const initialTrolley = {};
              BLEED_TROLley_DATA.forEach(comp => comp.items.forEach(item => { initialTrolley[item.name] = { checked: false, expiry: item.defaultExpiry || '' }; }));
              setChecklist(initialTrolley);
            } else {
              const initialChecklist = {};
              getDailyTasks(key, selectedUnit).forEach(item => initialChecklist[`daily_${item}`] = false);
              getWeeklyTasks(key, selectedUnit).forEach(item => initialChecklist[`weekly_${item}`] = false);
              setChecklist(initialChecklist);
            }
            setView('check');
          };

          const handleToggle = (itemKey) => setChecklist(prev => ({ ...prev, [itemKey]: !prev[itemKey] }));
          const handleTrolleyCheck = (name, checked) => setChecklist(prev => ({ ...prev, [name]: { ...prev[name], checked } }));
          const handleTrolleyExpiry = (name, expiry) => setChecklist(prev => ({ ...prev, [name]: { ...prev[name], expiry } }));

          const handleDelete = async (logId) => {
            if (pinInput !== ADMIN_PIN) { setError("Invalid Admin PIN."); setPinInput(''); return; }
            try {
              await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'checklist_logs', logId));
              setDeleteConfirmId(null); setPinInput(''); setError(null);
            } catch (err) { setError("Failed to delete entry."); }
          };

          const handleResolve = async (logId) => {
            if (!resolveInitials.trim() || !resolveNote.trim()) return;
            try {
               await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'checklist_logs', logId), {
                  isResolved: true, resolvedBy: resolveInitials.toUpperCase(), resolveNote: resolveNote.trim(), resolvedAt: new Date()
               });
               setResolveId(null); setResolveInitials(''); setResolveNote('');
            } catch(err) { setError("Failed to resolve action."); }
          };

          const handleSubmit = async (e) => {
            e.preventDefault();
            if (!initials.trim()) return;
            setSubmitting(true); setError(null);
            try {
              const [year, month, day] = auditDate.split('-');
              const targetTimestamp = new Date();
              targetTimestamp.setFullYear(parseInt(year), parseInt(month) - 1, parseInt(day));
              const isToday = auditDate === new Date().toISOString().split('T')[0];
              if (!isToday) targetTimestamp.setHours(12, 0, 0, 0);
              
              const payload = {
                initials: initials.toUpperCase(), locationKey: selectedLocKey,
                locationTitle: selectedLocKey === 'bleed_trolley' ? "GI Bleed Emergency Trolley" : CHECKLIST_DATA[selectedLocKey].title,
                unit: selectedUnit, comment: comment.trim(), timestamp: targetTimestamp, userId: user.uid,
                isLateEntry: !isToday, type: selectedLocKey === 'bleed_trolley' ? 'trolley_audit' : 'standard_audit'
              };

              if (isRoomClosed && selectedLocKey !== 'bleed_trolley') payload.type = 'room_closure';
              else payload.checklist = checklist;

              await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'checklist_logs'), payload);
              setInitials(''); setComment(''); setHistoryTab(selectedLocKey === 'bleed_trolley' ? 'logs' : 'compliance'); setView('history');
            } catch (err) { setError("Failed to save checklist."); } finally { setSubmitting(false); }
          };

          const handleClosureSubmit = async (e) => {
            e.preventDefault();

              await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'checklist_logs'), {

            const reportLogs = currentLogs.filter(log => {

            let complianceHtml = `
              <div style="margin-bottom: 30px; border-bottom: 2px solid #e2e8f0; padding-bottom: 20px;">

                <table style="width: 100%; border-collapse: collapse; font-size: 12px; font-family: sans-serif;">
                  <thead>
                    <tr><th style="width: 25%; text-align: left; padding: 10px; border-bottom: 2px solid #cbd5e1; color: #475569;">Location</th>
            `;
            
            const reversedDays = [...last7Days].reverse();
            reversedDays.forEach(d => { complianceHtml += `<th style="text-align: center; padding: 10px; border-bottom: 2px solid #cbd5e1; color: #475569;">${d.toLocaleDateString(undefined, {weekday: 'short', month: 'short', day: 'numeric'})}</th>`; });
            complianceHtml += `</tr></thead><tbody>`;

            Object.entries(CHECKLIST_DATA).forEach(([locKey, locData]) => {

              reversedDays.forEach(d => {
                const closureLog = currentLogs.find(log => (log.type === 'unit_closure' || (log.type === 'room_closure' && log.locationKey === locKey)) && isSameDay(getLogDate(log), d));
                if (closureLog) { complianceHtml += `<td style="color: #64748b; font-size: 11px; text-align: center; padding: 10px; border-bottom: 1px solid #e2e8f0; background-color: #f8fafc;">Closed</td>`; return; }

                const standardLog = currentLogs.find(log => log.type !== 'unit_closure' && log.type !== 'room_closure' && log.type !== 'trolley_audit' && isSameDay(getLogDate(log), d) && log.locationKey === locKey);
                if (standardLog) {
                  const dailyKeys = Object.keys(standardLog.checklist || {}).filter(k => k.startsWith('daily_'));
                  const isAllDone = dailyKeys.length === 0 || dailyKeys.every(k => standardLog.checklist[k]);
                  if (isAllDone) complianceHtml += `<td style="color: #15803d; font-weight: bold; text-align: center; padding: 10px; border-bottom: 1px solid #e2e8f0; background-color: #f0fdf4;">Done</td>`;
                  else complianceHtml += `<td style="color: #b45309; font-weight: bold; text-align: center; padding: 10px; border-bottom: 1px solid #e2e8f0; background-color: #fffbeb;">Incomplete</td>`;
                } else complianceHtml += `<td style="color: #b91c1c; font-weight: bold; text-align: center; padding: 10px; border-bottom: 1px solid #e2e8f0; background-color: #fef2f2;">Missing</td>`;
              });
              complianceHtml += `</tr>`;
            });
            complianceHtml += `</tbody></table></div>`;

            let html = `
              <!DOCTYPE html><html><head><title>${selectedUnit} - Weekly Audit Report</title>
                <style>
                  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; padding: 40px; color: #1e293b; line-height: 1.5; }
                  h1 { color: #1e40af; text-align: center; margin-bottom: 5px; font-size: 26px; font-weight: 800; text-transform: uppercase; }
                  .subtitle { text-align: center; color: #64748b; margin-bottom: 10px; font-size: 14px; font-weight: 500; }
                  .date-range { text-align: center; color: #1e293b; margin-bottom: 40px; font-size: 16px; font-weight: 700; background-color: #f1f5f9; padding: 8px; border-radius: 8px; width: fit-content; margin-left: auto; margin-right: auto; }
                  .logs-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; }
                  .logs-table th, .logs-table td { border-bottom: 1px solid #e2e8f0; padding: 14px 10px; text-align: left; vertical-align: top; }
                  .logs-table th { background-color: #f8fafc; color: #475569; font-weight: bold; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; border-top: 2px solid #cbd5e1; border-bottom: 2px solid #cbd5e1; }
                  .logs-table tr:nth-child(even) { background-color: #f8fafc; }
                  .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
                  .bg-green { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
                  .bg-red { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
                  .bg-orange { background-color: #ffedd5; color: #c2410c; border: 1px solid #fed7aa; }
                  .bg-gray { background-color: #e2e8f0; color: #475569; border: 1px solid #cbd5e1; }
                  .date-cell { white-space: nowrap; width: 12%; }
                  .details-block { display: flex; flex-direction: column; gap: 6px; }
                </style>
              </head><body>
                <h1>Weekly Audit Report</h1><div class="subtitle">${selectedUnit} - GI Unit Daily Checklist</div>
                <div class="date-range">Report Period: ${oldestDate} &mdash; ${newestDate}</div>
                ${complianceHtml}
                <h2 style="color: #334155; font-size: 18px; margin-top: 40px; margin-bottom: 5px;">Detailed Log Trail</h2>
                <table class="logs-table"><thead><tr><th>Date / Time</th><th style="width: 15%">Location</th><th style="width: 10%">Staff</th><th style="width: 15%">Status</th><th style="width: 48%">Details & Notes</th></tr></thead><tbody>
            `;

            if (reportLogs.length === 0) html += `<tr><td colspan="5" style="text-align: center; padding: 20px; color: #64748b; font-style: italic;">No audit records found.</td></tr>`;

              reportLogs.forEach(log => {

                const lateEntryHtml = ''; // Hidden intentionally for clean audits
                
                if (log.type === 'unit_closure' || log.type === 'room_closure') {

                  const statusBadge = `<span class="badge bg-gray">${isUnit ? 'Not Running' : 'Room Closed'}</span>`;
                  const detailsText = log.comment ? `<strong>Reason:</strong> ${log.comment}` : '<em>No reason provided</em>';
                  html += `<tr><td class="date-cell"><strong>${dateStr}</strong><br/><span style="color: #64748b;">${timeStr}</span>${lateEntryHtml}</td><td><strong>${isUnit ? 'Entire Unit' : log.locationTitle}</strong></td><td>${log.initials}</td><td>${statusBadge}</td><td style="color: #475569;">${detailsText}</td></tr>`;
                  return;

                if (log.type === 'trolley_audit') {

                  const expiringItems = allItems.filter(k => log.checklist[k].expiry && checkExpiryWarning(log.checklist[k].expiry, dateLogicStr));
                  const statusBadge = missingItems.length === 0 ? `<span class="badge bg-green">Fully Stocked</span>` : `<span class="badge bg-red">Missing (${missingItems.length})</span>`;
                  let detailsLines = [];
                  if (missingItems.length > 0) detailsLines.push(`<div style="color: #b91c1c;"><strong>Missing:</strong> ${missingItems.join(', ')}</div>`);
                  if (expiringItems.length > 0) detailsLines.push(`<div style="color: #c2410c;"><strong>Expiring Soon/Expired:</strong> ${expiringItems.join(', ')}</div>`);
                  if (log.comment) detailsLines.push(`<div style="color: #334155;"><strong>Notes:</strong> <em>"${log.comment}"</em></div>`);
                  if (log.isResolved) detailsLines.push(`<div style="color: #166534; margin-top: 4px; padding: 4px; background-color: #f0fdf4; border-radius: 4px; border: 1px solid #bbf7d0;"><strong>✓ Resolved by ${log.resolvedBy}:</strong> ${log.resolveNote}</div>`);
                  
                  const finalDetails = detailsLines.length > 0 ? `<div class="details-block">${detailsLines.join('')}</div>` : `<span style="color: #94a3b8; font-style: italic;">All items present and in-date.</span>`;
                  html += `<tr><td class="date-cell"><strong>${dateStr}</strong><br/><span style="color: #64748b;">${timeStr}</span>${lateEntryHtml}</td><td><strong>${log.locationTitle}</strong></td><td>${log.initials}</td><td>${statusBadge}</td><td>${finalDetails}</td></tr>`;
                  return;
                }

                const dailyKeys = Object.keys(log.checklist || {}).filter(k => k.startsWith('daily_'));
                const isAllDailyDone = dailyKeys.length === 0 || dailyKeys.every(k => log.checklist[k]);
                const missingDailyItems = dailyKeys.filter(k => !log.checklist[k]).map(k => k.replace('daily_', ''));
                const statusBadge = isAllDailyDone ? `<span class="badge bg-green">Completed</span>` : `<span class="badge bg-orange">Incomplete</span>`;
                let detailsLines = [];
                if (!isAllDailyDone && missingDailyItems.length > 0) detailsLines.push(`<div style="color: #c2410c;"><strong>Missed Daily:</strong> ${missingDailyItems.join(', ')}</div>`);
                const weeklyDoneList = Object.entries(log.checklist || {}).filter(([k, v]) => k.startsWith('weekly_') && v).map(([k]) => k.replace('weekly_', ''));
                if (weeklyDoneList.length > 0) detailsLines.push(`<div style="color: #1d4ed8;"><strong>Weekly Tasks Done:</strong> ${weeklyDoneList.join(', ')}</div>`);
                if (log.comment) detailsLines.push(`<div style="color: #334155;"><strong>Notes:</strong> <em>"${log.comment}"</em></div>`);
                if (log.isResolved) detailsLines.push(`<div style="color: #166534; margin-top: 4px; padding: 4px; background-color: #f0fdf4; border-radius: 4px; border: 1px solid #bbf7d0;"><strong>✓ Resolved by ${log.resolvedBy}:</strong> ${log.resolveNote}</div>`);
                
                const finalDetails = detailsLines.length > 0 ? `<div class="details-block">${detailsLines.join('')}</div>` : `<span style="color: #94a3b8; font-style: italic;">Standard tasks completed.</span>`;
                html += `<tr><td class="date-cell"><strong>${dateStr}</strong><br/><span style="color: #64748b;">${timeStr}</span>${lateEntryHtml}</td><td><strong>${log.locationTitle}</strong></td><td>${log.initials}</td><td>${statusBadge}</td><td>${finalDetails}</td></tr>`;
              });
            }

            html += `</tbody></table><script>window.onload = () => { setTimeout(() => { window.print(); }, 250); }<\/script></body></html>`;

                  <div className="flex items-center gap-3">
                    <Activity className="w-6 h-6 text-blue-200" />
                    <div>
                      <h1 className="font-extrabold text-lg tracking-tight leading-tight">{selectedUnit}</h1>
                      <div className="text-[10px] text-blue-200 uppercase tracking-widest font-bold">GI Unit Checklist</div>
                    </div>
                  </div>
                  {(view === 'check' || view === 'mark-closed') && (
                    <button onClick={() => setView('select-location')} className="p-2 hover:bg-blue-600 rounded-full transition-colors"><ArrowLeft className="w-5 h-5" /></button>

                </div>
              </header>

              <main className="max-w-md mx-auto p-4 space-y-6">
                {error && <div className="bg-red-50 text-red-600 p-3 rounded-2xl border border-red-100 text-sm flex items-start gap-2 shadow-sm animate-pulse"><AlertCircle className="w-4 h-4 flex-shrink-0" /><span className="font-medium">{error}</span></div>}

                {/* --- Home View --- */}
                {view === 'home' && (
                  <div className="space-y-6 pt-2">
                    <div className="bg-white p-1.5 rounded-2xl border border-gray-200 flex shadow-sm">
                      <button onClick={() => setSelectedUnit('Lady Sobell')} className={`flex-1 py-3 text-sm font-extrabold rounded-xl transition-all ${selectedUnit === 'Lady Sobell' ? 'bg-blue-700 text-white shadow-md' : 'text-gray-500 hover:bg-gray-50'}`}>Lady Sobell</button>
                      <button onClick={() => setSelectedUnit('Endoscopy Suite')} className={`flex-1 py-3 text-sm font-extrabold rounded-xl transition-all ${selectedUnit === 'Endoscopy Suite' ? 'bg-blue-700 text-white shadow-md' : 'text-gray-500 hover:bg-gray-50'}`}>Endoscopy Suite</button>

                    <div className="bg-gradient-to-br from-blue-500 to-blue-700 text-white p-6 rounded-3xl shadow-lg relative overflow-hidden">
                       <div className="relative z-10">

                                <div className="space-y-2">
                                  <div className="flex items-center gap-2"><div className="bg-gray-200 p-2 rounded-xl"><Ban className="w-4 h-4 text-gray-600" /></div><span className="font-extrabold text-gray-800">{isUnit ? 'Unit Closed' : log.locationTitle}</span></div>
                                  <div className="flex items-center gap-2 text-xs text-gray-500 pl-1"><User className="w-3.5 h-3.5" /><span>Staff: <strong className="text-gray-700 uppercase">{log.initials}</strong></span></div>
                                </div>
                                <div className="flex flex-col items-end gap-1.5">
                                  <div className="text-[10px] font-bold text-gray-500 flex items-center gap-1 bg-white px-3 py-1.5 rounded-full border border-gray-200"><Clock className="w-3 h-3" />{formatDate(log.timestamp)}</div>
                                </div>
                              </div>
                              <div className="pt-3 border-t border-gray-200 flex flex-wrap gap-2">
                                <span className="text-[10px] px-2.5 py-1 bg-gray-200 text-gray-700 rounded-lg border border-gray-300 font-extrabold uppercase tracking-wide">{isUnit ? 'Unit Not Running' : 'Room Closed'}</span>
                              </div>
                              {log.comment && <div className="mt-3 p-3 bg-white rounded-2xl border border-gray-200 text-sm text-gray-600 italic"><span className="font-bold text-gray-500 not-italic block text-[10px] uppercase tracking-wider mb-1">Reason:</span>"{log.comment}"</div>}
                            </div>
                          );
                        }

                        if (log.type === 'trolley_audit') {
                          const allItems = Object.keys(log.checklist || {});
                          const missingItems = allItems.filter(k => !log.checklist[k].checked);
                          const expiringItems = allItems.filter(k => log.checklist[k].expiry && checkExpiryWarning(log.checklist[k].expiry, dateLogicStr));
                          const isPerfect = missingItems.length === 0;

                          return (
                            <div key={log.id} className="bg-white p-5 rounded-3xl border border-gray-100 shadow-sm space-y-4 relative group">
                              <div className="absolute top-4 right-4 flex flex-col items-end gap-2">
                                 {deleteConfirmId === log.id ? (
                                   <div className="flex flex-col gap-2 items-end bg-white p-3 rounded-2xl shadow-xl border border-gray-200 z-10 animate-in fade-in zoom-in duration-200">
                                     <div className="flex items-center gap-1.5 text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1"><Lock className="w-3 h-3" /> Admin Security</div>
                                     <input type="password" value={pinInput} onChange={(e) => setPinInput(e.target.value)} placeholder="Enter PIN" className="w-24 p-2 text-xs border border-gray-200 rounded-lg text-center" />
                                     <div className="flex gap-1.5 w-full">
                                        <button onClick={() => {setDeleteConfirmId(null); setPinInput('');}} className="flex-1 text-[9px] font-bold text-gray-400 py-1.5 rounded-lg border border-gray-100 hover:bg-gray-50">Cancel</button>
                                        <button onClick={() => handleDelete(log.id)} className="flex-1 bg-red-600 text-white text-[9px] font-bold py-1.5 rounded-lg hover:bg-red-700 shadow-sm">Delete</button>
                                     </div>
                                   </div>
                                 ) : <button onClick={() => setDeleteConfirmId(log.id)} className="text-gray-300 hover:text-red-500 transition-colors p-1" title="Delete Entry"><Trash2 className="w-4 h-4" /></button>}
                              </div>

                              <div className="flex justify-between items-start pr-10">
                                <div className="space-y-2">
                                  <div className="flex items-center gap-2"><div className="bg-red-50 p-2 rounded-xl"><Stethoscope className="w-4 h-4 text-red-600" /></div><span className="font-extrabold text-gray-800">{log.locationTitle}</span></div>
                                  <div className="flex items-center gap-2 text-xs text-gray-500 pl-1"><User className="w-3.5 h-3.5" /><span>Staff: <strong className="text-gray-700 uppercase">{log.initials}</strong></span></div>
                                </div>
                                <div className="flex flex-col items-end gap-1.5">
                                  <div className="text-[10px] font-bold text-gray-500 flex items-center gap-1 bg-gray-50 px-3 py-1.5 rounded-full border border-gray-100"><Clock className="w-3 h-3" />{formatDate(log.timestamp)}</div>
                                </div>
                              </div>
                              
                              <div className="pt-3 border-t border-gray-50 flex flex-wrap gap-2">
                                <span className={`text-[10px] px-2.5 py-1 rounded-lg border font-extrabold uppercase tracking-wide ${isPerfect ? 'bg-green-50 text-green-700 border-green-200' : 'bg-red-50 text-red-700 border-red-200'}`}>{isPerfect ? 'Trolley Stocked' : `Missing Items (${missingItems.length})`}</span>
                                {expiringItems.length > 0 && <span className="text-[10px] px-2.5 py-1 bg-orange-50 text-orange-700 rounded-lg border border-orange-200 font-extrabold uppercase tracking-wide flex items-center gap-1"><AlertCircle className="w-3 h-3" /> Expiring Soon ({expiringItems.length})</span>}
                              </div>
                              {!isPerfect && <div className="mt-2 text-xs text-red-600 bg-red-50 p-3 rounded-2xl border border-red-100"><span className="font-bold uppercase tracking-wider text-[9px] block mb-1">Missing Items:</span>{missingItems.join(', ')}</div>}
                              {expiringItems.length > 0 && <div className="mt-2 text-xs text-orange-700 bg-orange-50 p-3 rounded-2xl border border-orange-200"><span className="font-bold uppercase tracking-wider text-[9px] block mb-1">Items Exiring Soon:</span>{expiringItems.join(', ')}</div>}
                              {log.comment && <div className="mt-3 p-3 bg-gray-50 rounded-2xl border border-gray-100 text-sm text-gray-600 italic"><span className="font-bold text-gray-500 not-italic block text-[10px] uppercase tracking-wider mb-1">Notes:</span>"{log.comment}"</div>}
                              {log.isResolved && <div className="mt-2 text-xs text-green-800 bg-green-50 p-2 rounded-lg border border-green-100 flex items-center gap-1.5"><CheckCircle2 className="w-3.5 h-3.5" /><span><strong>Resolved:</strong> {log.resolveNote} (by {log.resolvedBy})</span></div>}
                            </div>
                          );
                        }

                        const dailyKeys = Object.keys(log.checklist || {}).filter(k => k.startsWith('daily_'));
                        const dailyDone = dailyKeys.filter(k => log.checklist[k]).length;
                        const dailyTotal = dailyKeys.length;
                        const isAllDailyDone = dailyTotal === 0 || dailyDone === dailyTotal;
                        const missingDaily = dailyKeys.filter(k => !log.checklist[k]).map(k => k.replace('daily_', ''));

                        return (
                        <div key={log.id} className="bg-white p-5 rounded-3xl border border-gray-100 shadow-sm space-y-4 relative group">
                          <div className="absolute top-4 right-4 flex flex-col items-end gap-2">
                             {deleteConfirmId === log.id ? (
                               <div className="flex flex-col gap-2 items-end bg-white p-3 rounded-2xl shadow-xl border border-gray-200 z-10 animate-in fade-in zoom-in duration-200">
                                 <div className="flex items-center gap-1.5 text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1"><Lock className="w-3 h-3" /> Admin Security</div>
                                 <input type="password" value={pinInput} onChange={(e) => setPinInput(e.target.value)} placeholder="Enter PIN" className="w-24 p-2 text-xs border border-gray-200 rounded-lg text-center" />
                                 <div className="flex gap-1.5 w-full">
                                    <button onClick={() => {setDeleteConfirmId(null); setPinInput('');}} className="flex-1 text-[9px] font-bold text-gray-400 py-1.5 rounded-lg border border-gray-100 hover:bg-gray-50">Cancel</button>
                                    <button onClick={() => handleDelete(log.id)} className="flex-1 bg-red-600 text-white text-[9px] font-bold py-1.5 rounded-lg hover:bg-red-700 shadow-sm">Delete</button>
                                 </div>
                               </div>
                             ) : <button onClick={() => setDeleteConfirmId(log.id)} className="text-gray-300 hover:text-red-500 transition-colors p-1" title="Delete Entry"><Trash2 className="w-4 h-4" /></button>}
                          </div>

                          <div className="flex justify-between items-start pr-10">
                            <div className="space-y-2">
                              <div className="flex items-center gap-2"><div className="bg-blue-50 p-2 rounded-xl"><MapPin className="w-4 h-4 text-blue-600" /></div><span className="font-extrabold text-gray-800">{log.locationTitle}</span></div>
                              <div className="flex items-center gap-2 text-xs text-gray-500 pl-1"><User className="w-3.5 h-3.5" /><span>Staff: <strong className="text-gray-700 uppercase">{log.initials}</strong></span></div>
                            </div>
                            <div className="flex flex-col items-end gap-1.5">
                              <div className="text-[10px] font-bold text-gray-500 flex items-center gap-1 bg-gray-50 px-3 py-1.5 rounded-full border border-gray-100"><Clock className="w-3 h-3" />{formatDate(log.timestamp)}</div>
                            </div>
                          </div>
                          
                          <div className="pt-3 border-t border-gray-50 flex flex-wrap gap-2">
                            <span className={`text-[10px] px-2.5 py-1 rounded-lg border font-extrabold uppercase tracking-wide ${isAllDailyDone ? 'bg-green-50 text-green-700 border-green-200' : 'bg-orange-50 text-orange-700 border-orange-200'}`}>{isAllDailyDone ? 'Daily Done' : `Incomplete: ${dailyDone}/${dailyTotal}`}</span>
                            {Object.entries(log.checklist || {}).filter(([k,v]) => k.startsWith('weekly_') && v).length > 0 && <span className="text-[10px] px-2.5 py-1 bg-blue-50 text-blue-700 rounded-lg border border-blue-200 font-extrabold uppercase tracking-wide">+ Weekly Tasks</span>}
                          </div>
                          {!isAllDailyDone && <div className="mt-2 text-xs text-orange-700 bg-orange-50 p-3 rounded-2xl border border-orange-200"><span className="font-bold uppercase tracking-wider text-[9px] block mb-1">Missed Tasks:</span>{missingDaily.join(', ')}</div>}
                          {log.comment && <div className="mt-3 p-3 bg-gray-50 rounded-2xl border border-gray-100 text-sm text-gray-600 italic"><span className="font-bold text-gray-500 not-italic block text-[10px] uppercase tracking-wider mb-1">Notes:</span>"{log.comment}"</div>}
                          {log.isResolved && <div className="mt-2 text-xs text-green-800 bg-green-50 p-2 rounded-lg border border-green-100 flex items-center gap-1.5"><CheckCircle2 className="w-3.5 h-3.5" /><span><strong>Resolved:</strong> {log.resolveNote} (by {log.resolvedBy})</span></div>}
                        </div>
                        );
                      })
                    )}
                  </div>
                )}
              </main>

              {/* --- Footer --- */}
              <footer className="max-w-md mx-auto px-4 pb-8 pt-4 text-center">
                <p className="text-[10px] text-gray-400 font-medium leading-relaxed">&copy; {new Date().getFullYear()} Developed by Darryl James Tolentino, Junior Charge Nurse, Endoscopy Unit WPH through Gemini.</p>
              </footer>

              {/* --- Bottom Navigation --- */}
              <nav className="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 z-50 pb-safe shadow-[0_-4px_20px_-10px_rgba(0,0,0,0.1)]">
                <div className="max-w-md mx-auto flex justify-between px-2 py-1">
                  <NavItem icon={<LayoutDashboard className="w-6 h-6" />} label="Home" isActive={view === 'home'} onClick={() => setView('home')} />
                  <NavItem icon={<ListChecks className="w-6 h-6" />} label="Audit" isActive={view === 'select-location' || view === 'check'} onClick={() => setView('select-location')} />
                  <NavItem icon={<div className="relative"><CalendarDays className="w-6 h-6" />{actionItems.length > 0 && <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-red-500 rounded-full border border-white"></span>}</div>} label="Logs" isActive={view === 'history'} onClick={() => setView('history')} />
                </div>
              </nav>
            </div>
          );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
